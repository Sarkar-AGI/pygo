name: PyGo Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - name: Verify version metadata
        shell: bash
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}" || {
            echo "VERSION does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: Build native runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_ENABLE_CUDA=OFF -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Install native runtime
        run: cmake --install build --prefix "$RUNNER_TEMP/pygo"
      - name: Test Python ecosystem
        run: |
          python -m pip install -e . --no-deps
          python -m compileall -q python
          python -m pytest tests/python -q
      - name: Test Go ecosystem
        env:
          CGO_LDFLAGS: "-L${{ runner.temp }}/pygo/lib -Wl,-rpath,${{ runner.temp }}/pygo/lib"
          LD_LIBRARY_PATH: "${{ runner.temp }}/pygo/lib"
        run: go test ./...
      - name: Build Python wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Package source release
        run: |
          mkdir -p release
          cp dist/*.whl release/
          cp build/libpygo.so release/
          cp cpp/bridge/c_api.h release/
          tar -czf "release/pygo-${GITHUB_REF_NAME}.tar.gz" --exclude=.git --exclude=build --exclude=dist --exclude=release .
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
